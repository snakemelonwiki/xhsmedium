<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta id="appViewport" name="viewport" content="width=device-width, initial-scale=1.0">
  <title>局域网双端管理系统</title>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var isMobile = /iPhone|iPad|iPod|Android|Mobile|Windows Phone/i.test(ua) || Math.min(screen.width || 0, screen.height || 0) <= 768;
      var viewport = document.getElementById("appViewport");
      if (isMobile && viewport) {
        viewport.setAttribute("content", "width=1380, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes");
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=20260503-mobile-2">
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="/app.js?v=20260503-mobile-2"></script>
</body>
</html>
